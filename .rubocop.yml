inherit_from: ~/.config/rubocop/config.yml

AllCops:
  Exclude:
    - 'bin/*'

  TargetRubyVersion: 3.3

Layout/LineLength:
  Exclude:
    - 'spec/**/*.rb'

# setting to 6 to match RubyMine autoformat
Layout/FirstArrayElementIndentation:
  IndentationWidth: 6

# setting to 6 to match RubyMine autoformat
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented_relative_to_receiver
  IndentationWidth: 6

# rspec blocks are huge by design
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*.rb'

Metrics/ModuleLength:
  Exclude:
    - 'spec/**/*.rb'

# Disabling because it's marginally better, if at all, and not worth rewriting all step descripts right now
RSpec/ExampleWording:
  Enabled: false
